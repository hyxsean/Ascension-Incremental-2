<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascension 2 Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <span class="game-tag">Ascension Incremental 2</span>
        <h1>Calculator</h1>
      </div>
      <button id="resetBtn" class="reset-btn" title="Reset stats to default">Reset Defaults</button>
    </div>
  </header>

  <main class="container">
    <!-- Controls Panel -->
    <div class="calculator-panel">
      
      <!-- Section: Player Stats -->
      <section class="panel-section">
        <h2 class="section-title">PLAYER STATISTICS</h2>
        
        <div class="inputs-grid">
          <div class="input-group">
            <label for="luckInput">RUNE LUCK</label>
            <input type="text" id="luckInput" value="" placeholder="e.g. 738.01Qn">
          </div>

          <!-- Basic Mode Single Input -->
          <div class="input-group" id="groupRps">
            <label for="rpsInput">MY CURRENT RATE (RPS)</label>
            <input type="text" id="rpsInput" value="" placeholder="e.g. 2000">
            <span class="parsed-rate-text" id="parsedRateDisplay">Parsed Rate: 0 RPS</span>
          </div>

          <!-- Advanced Mode Speed & Bulk (Hidden in Basic Mode) -->
          <div class="input-group" id="groupSpeed" style="display: none;">
            <label for="speedInput">RUNE SPEED</label>
            <input type="text" id="speedInput" value="" placeholder="e.g. 139.1M">
          </div>
          <div class="input-group" id="groupBulk" style="display: none;">
            <label for="bulkInput">RUNE BULK</label>
            <input type="text" id="bulkInput" value="" placeholder="e.g. 11.38Sp">
          </div>

          <div class="input-group">
            <label for="cloneInput">RUNE CLONE</label>
            <input type="text" id="cloneInput" value="" placeholder="e.g. 8">
          </div>
        </div>

        <!-- Toggles Row -->
        <div class="toggles-row">
          <div class="input-group toggle-group">
            <label class="toggle-switch">
              <input type="checkbox" id="luckToggle" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-label">Luck Multiplier</span>
            </label>
          </div>

          <div class="input-group toggle-group">
            <label class="toggle-switch">
              <input type="checkbox" id="advancedToggle">
              <span class="toggle-slider"></span>
              <span class="toggle-label">Advanced Mode</span>
            </label>
          </div>
        </div>
      </section> 

      <!-- Section: Active Boosts & Potions (Advanced Mode Only) -->
      <section class="panel-section" id="potionsSection" style="display: none;">
        <h2 class="section-title">ACTIVE BOOSTS & POTIONS</h2>
        <div class="potions-grid">
          <label class="potion-card">
            <input type="checkbox" id="potServer">
            <div class="potion-content">
              <span class="potion-title">Server Boost</span>
              <span class="potion-buff pot-server">Stats +25%</span>
            </div>
          </label>
          <label class="potion-card">
            <input type="checkbox" id="potLuck" checked>
            <div class="potion-content">
              <span class="potion-title">Rune Luck Potion</span>
              <span class="potion-buff pot-luck">Luck 2x</span>
            </div>
          </label>
          <label class="potion-card">
            <input type="checkbox" id="potSpeed" checked>
            <div class="potion-content">
              <span class="potion-title">Rune Speed Potion</span>
              <span class="potion-buff pot-speed">Speed 2x</span>
            </div>
          </label>
          <label class="potion-card">
            <input type="checkbox" id="potBulk" checked>
            <div class="potion-content">
              <span class="potion-title">Rune Bulk Potion</span>
              <span class="potion-buff pot-bulk">Bulk 2x</span>
            </div>
          </label>
        </div>
      </section>

      <!-- Output Banner -->
      <div class="stats-summary">
        <div class="summary-metric">
          <span class="metric-label">EFFECTIVE RPS</span>
          <span class="metric-value value-actual" id="actualRpsDisplay">0</span>
        </div>
        <div class="summary-metric" id="baseRpsMetric" style="display: none;">
          <span class="metric-label">BASE RPS</span>
          <span class="metric-value" id="baseRpsDisplay">0</span>
        </div>
        <div class="summary-metric">
          <span class="metric-label">EFFECTIVE LUCK</span>
          <span class="metric-value value-luck" id="luckDisplay">1x</span>
        </div>
      </div>
    </div>

    <!-- Section: Target Goal -->
    <section class="panel-section calculator-panel">
      <h2 class="section-title">TARGET PROGRESSION</h2>
      <div class="inputs-grid">
        <div class="input-group">
          <label for="incomeInput">INCOME RATE (/SEC)</label>
          <input type="text" id="incomeInput" value="" placeholder="e.g. 4.6T">
        </div>
        <div class="input-group">
          <label for="currentInput">CURRENT BALANCE</label>
          <input type="text" id="currentInput" value="" placeholder="e.g. 900Qd">
        </div>
        <div class="input-group">
          <label for="targetInput">GOAL COST</label>
          <input type="text" id="targetInput" value="" placeholder="e.g. 2Qn">
        </div>
      </div>
      <div class="time-display-box">
        <span class="time-label">Time to Reach Target:</span>
        <span class="time-highlight" id="goalTimeDisplay">Calculating...</span>
      </div>
    </section>

    <!-- Dynamic Category Navigation Tabs -->
    <div class="tabs-container"></div>

    <!-- Cards Grid -->
    <div class="grid" id="runeGrid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
